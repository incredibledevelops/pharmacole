<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d6e6e">
  <meta name="description" content="{% block meta_description %}Pharmacole is a multi-tenant pharmacy SaaS with POS, inventory, expiry tracking and Paystack billing — built for Ghana pharmacies.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  <link rel="canonical" href="{{ request.url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pharmacole">
  <meta property="og:title" content="{% block og_title %}Pharmacole · Multi-tenant Pharmacy SaaS{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Run your pharmacy smarter. POS, inventory, expiry tracking, employee management, and monthly billing via Paystack.{% endblock %}">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:image" content="{{ url_for('static', filename='og-image.png', _external=True) }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block tw_title %}Pharmacole · Multi-tenant Pharmacy SaaS{% endblock %}">
  <meta name="twitter:description" content="{% block tw_description %}POS, inventory, expiry tracking, and monthly billing via Paystack.{% endblock %}">
  <meta name="twitter:image" content="{{ url_for('static', filename='og-image.png', _external=True) }}">

  <title>{% block title %}Pharmacole · Multi-tenant Pharmacy SaaS{% endblock %}</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0d6e6e',
            primaryLight: '#14b8a6',
            primaryDark: '#0a5555',
            sidebar: '#0f172a',
            accent: '#f59e0b'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'Segoe UI', 'sans-serif']
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'fade-up': 'fadeUp 0.6s ease-out',
            'slide-in': 'slideIn 0.4s ease-out',
            'float': 'float 6s ease-in-out infinite',
            'pulse-soft': 'pulseSoft 2.5s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s linear infinite'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            slideIn: {
              '0%': { opacity: '0', transform: 'translateX(30px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-12px)' }
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.7' }
            },
            shimmer: {
              '0%': { backgroundPosition: '-1000px 0' },
              '100%': { backgroundPosition: '1000px 0' }
            }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { min-height: 100vh; min-height: 100dvh; }

    /* Focus ring for accessibility */
    *:focus-visible {
      outline: 2px solid #14b8a6;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 6px; border: 2px solid #f1f5f9; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    @media (max-width: 640px) {
      button, a.btn, input[type="submit"] { min-height: 44px; }
      input, select, textarea { font-size: 16px; }
    }

    .table-scroll { -webkit-overflow-scrolling: touch; }
    .table-scroll::-webkit-scrollbar { height: 6px; }
    .table-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Gradient text utility */
    .gradient-text {
      background: linear-gradient(135deg, #0d6e6e 0%, #14b8a6 50%, #0d6e6e 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }

    /* Glass morphism */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Interactive card hover */
    .card-hover {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(13, 110, 110, 0.25);
    }

    /* Reveal on scroll */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }

    /* Button ripple-ish pulse */
    .btn-primary {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.35) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .btn-primary:hover::after { opacity: 1; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(13, 110, 110, 0.5); }
    .btn-primary:active { transform: translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media print {
      aside, header button, .no-print { display: none !important; }
      main { padding: 0 !important; }
      body { background: white !important; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 font-sans antialiased">

{% include "_flashes.html" %}

{% block body %}{% endblock %}

<script>
  // Scroll reveal observer
  document.addEventListener('DOMContentLoaded', function () {
    const reveals = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window && reveals.length) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      reveals.forEach(el => observer.observe(el));
    } else {
      reveals.forEach(el => el.classList.add('is-visible'));
    }
  });
</script>
</body>
</html>
